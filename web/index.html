<!doctype html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

        <title>the n-body forge</title>

        <style>
            body {
                margin: 0px;
                overflow: hidden;
            }

            canvas {
                border: 0px none;
                background-color: black;
                padding-left: 0;
                padding-right: 0;
                margin-left: auto;
                margin-right: auto;
                display: block;
            }
        </style>
    </head>
    <body>
        <canvas
            id="canvas"
            oncontextmenu="event.preventDefault()"
            onkeydown="event.preventDefault()"
        ></canvas>
        <script type="text/javascript" src="odin.js"></script>
        <script>
            const odinMemoryInterface = new odin.WasmMemoryInterface();
            const odinImports = odin.setupDefaultImports(odinMemoryInterface);

            odinMemoryInterface.setIntSize(4);

            // The Module is used as configuration for emscripten.
            var Module = {
                // This is called by emscripten when it starts up.
                instantiateWasm: (imports, successCallback) => {
                    const newImports = {
                        ...odinImports,
                        ...imports,
                    };

                    return WebAssembly.instantiateStreaming(
                        fetch("index.wasm"),
                        newImports,
                    ).then(function (output) {
                        var e = output.instance.exports;
                        odinMemoryInterface.setExports(e);
                        odinMemoryInterface.setMemory(e.memory);
                        return successCallback(output.instance);
                    });
                },
                // This happens a bit after `instantiateWasm`, when everything is
                // done setting up. At that point we can run code.
                onRuntimeInitialized: () => {
                    var e = wasmExports;

                    const h = window.innerHeight;
                    const w = window.innerWidth;

                    e._start();
                    e.start(h, w);

                    function update() {
                        e.run();
                        window.requestAnimationFrame(update);
                    }

                    window.requestAnimationFrame(update);

                    const resizeObserver = new ResizeObserver((entries) => {
                        for (let entry of entries) {
                            const { width, height } = entry.contentRect;
                            canvas.width = width;
                            canvas.height = height;
                            e.update_size(height, width);
                        }
                    });

                    // Observe the body or the canvas itself
                    resizeObserver.observe(document.body);
                },
                print: (function () {
                    return function (text) {
                        console.log(text);
                    };
                })(),
                canvas: (function () {
                    return document.getElementById("canvas");
                })(),
            };
        </script>

        <!-- Emscripten injects its javascript here -->
        {{{ SCRIPT }}}
    </body>
</html>
